name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libayatana-appindicator3-dev libxkbcommon-dev \
            libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - run: cargo fmt --check
      - run: cargo test
      - run: cargo build --release

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          ./packaging/macos/bundle.sh
          ditto -c -k --keepParent target/MultiPaste.app MultiPaste-macos.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          install -D target/release/multipaste dist/multipaste
          install -D packaging/linux/multipaste.desktop dist/multipaste.desktop
          tar -czf MultiPaste-linux.tar.gz -C dist .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/release/multipaste.exe -DestinationPath MultiPaste-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MultiPaste-${{ runner.os }}
          path: |
            MultiPaste-*.zip
            MultiPaste-*.tar.gz
          if-no-files-found: ignore

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MultiPaste-*.zip
            MultiPaste-*.tar.gz
